# Configuration nginx pour EnginePC (application statique SPA).
# À placer dans /etc/nginx/sites-available/enginepc.heiphaistos.org puis :
#   ln -s /etc/nginx/sites-available/enginepc.heiphaistos.org /etc/nginx/sites-enabled/
#   certbot --nginx -d enginepc.heiphaistos.org
server {
    listen 80;
    listen [::]:80;
    server_name enginepc.heiphaistos.org;

    root /var/www/enginepc;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers générés par Vite (nom avec hash) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (/generer, /configurer/desktop, /partage/...) -> index.html
    # Données ouvertes (base étendue, taux de change) : rafraîchies par deploy/sync-data.sh
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
