# Configuration nginx pour EnginePC (application statique SPA).
# À placer dans /etc/nginx/sites-available/enginepc.heiphaistos.org puis :
#   ln -s /etc/nginx/sites-available/enginepc.heiphaistos.org /etc/nginx/sites-enabled/
#   certbot --nginx -d enginepc.heiphaistos.org
server {
    listen 80;
    listen [::]:80;
    server_name enginepc.heiphaistos.org;

    root /var/www/enginepc;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    # En-têtes de sécurité (copier deploy/security-headers.conf dans /etc/nginx/snippets/enginepc-security-headers.conf
    # en remplaçant __PRICE_API_ORIGIN__ par https://searchit.heiphaistos.org — deploy.sh le fait).
    # Inclus aussi dans chaque location : nginx n'hérite pas des add_header dès qu'une location déclare les siens.
    include /etc/nginx/snippets/enginepc-security-headers.conf;

    # Fichiers générés par Vite (nom avec hash) : cache long.
    location /assets/ {
        include /etc/nginx/snippets/enginepc-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (/generer, /configurer/desktop, /partage/...) -> index.html
    # Données ouvertes (base étendue, taux de change) : rafraîchies par deploy/sync-data.sh
    location /data/ {
        include /etc/nginx/snippets/enginepc-security-headers.conf;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/enginepc-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
