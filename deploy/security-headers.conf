# En-têtes de sécurité d'EnginePC, inclus dans le bloc server ET dans chaque location :
# nginx n'hérite pas des add_header du niveau supérieur dès qu'une location déclare les siens.
# __PRICE_API_ORIGIN__ est remplacé au build Docker par l'origine de VITE_PRICE_API_URL (voir Dockerfile).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self' https://api.frankfurter.dev https://fr.wikipedia.org https://en.wikipedia.org __PRICE_API_ORIGIN__; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
